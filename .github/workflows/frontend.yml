# The frontend's tests and typecheck.
#
# A second workflow, outside the wads convention, and that is the cost of it. The
# wads reusable workflow (i2mint/wads/.github/workflows/uv-ci.yml) is Python-only
# and `[tool.wads.ci]` exposes no key for a Node job, so there is nowhere in
# ci.yml for this to live. See issue #8: asking wads for an optional Node job is
# the better long-term answer if another repo ever wants the same, and nothing
# here forecloses it.
#
# Why it is worth a file: the vitest suite pins the one real bug this frontend has
# had -- the ProseMirror position-mapping biases were inverted, so a finding at
# offset 0 swallowed text inserted before it and claimed characters it had never
# seen. That reasoning reads fine either way round; only running it catches it.
name: Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

# A new push to the same branch supersedes the old run.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # LTS, and `cache` keys off the committed lockfile.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` not `install`: it installs exactly the committed lockfile and fails
      # if package.json and the lockfile disagree, which is the point in CI.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      # Catches a broken Vite config or an import that only resolves in dev.
      - name: Build
        run: npm run build
